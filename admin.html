<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yasin Ron — Admin</title><style>
body{margin:0;background:#07111f;color:#edf5ff;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:24px}
.box{background:#0d1a2b;border:1px solid #2a4565;border-radius:18px;padding:20px;margin:14px 0;animation:up .5s ease}
input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;background:#081525;border:1px solid #304966;color:#fff;border-radius:10px}
button{padding:11px 15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.danger{background:#991b1b}
.muted{color:#91a8c2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#10223a;padding:16px;border-radius:14px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><h1>👑 Yasin Ron Owner Admin</h1>
<div id="login" class="box"><h2>Administrator Login</h2><p class="muted">This page is separate from the Agent Portal.</p>
<input id="email" type="email" autocomplete="username" placeholder="Administrator email">
<input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="go">Login</button><p id="msg" class="muted"></p></div>
<div id="app" style="display:none"><div class="stats"><div class="stat"><b id="a">0</b><br>Agents</div><div class="stat"><b id="p">0</b><br>Pending</div><div class="stat"><b id="ok">0</b><br>Approved</div><div class="stat"><b id="no">0</b><br>Rejected</div></div>
<div class="box"><h2>👥 Agents</h2><div id="agents">Loading…</div></div><div class="box"><h2>📚 Submissions</h2><div id="subs">Loading…</div></div><button id="out" class="danger">Logout</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const ADMIN="7487289c-95a8-480d-af95-e2965774f1c4",cfg=window.EXCEL_MASTER_SUPABASE||{};let sb,user;
if(cfg.url&&cfg.key)sb=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
const $=x=>document.getElementById(x);
$("go").onclick=async()=>{if(!sb){$("msg").textContent="Supabase is not configured on admin.html.";return}
const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim().toLowerCase(),password:$("password").value});
if(error){$("msg").textContent=error.message;return} user=data.user;
if(user.id!==ADMIN){await sb.auth.signOut();$("msg").textContent="Access denied.";return}
const pr=await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();
if(pr.data?.role!=="admin"){await sb.auth.signOut();$("msg").textContent="Admin role missing.";return}
$("login").style.display="none";$("app").style.display="block";load()};
async function load(){const r=await sb.from("profiles").select("id,full_name,role,created_at").order("created_at",{ascending:false});const rows=r.data||[];$("a").textContent=rows.filter(x=>x.role==="agent").length;$("agents").innerHTML=rows.filter(x=>x.role==="agent").map(x=>"<div style='padding:10px;border-bottom:1px solid #243a54'><b>"+esc(x.full_name||"Agent")+"</b><br><span class=muted>"+esc(x.id)+"</span></div>").join("")||"No agents.";
const s=await sb.from("training_submissions").select("*").order("created_at",{ascending:false});const z=s.data||[];$("p").textContent=z.filter(x=>x.status==="pending").length;$("ok").textContent=z.filter(x=>x.status==="approved").length;$("no").textContent=z.filter(x=>x.status==="rejected").length;$("subs").innerHTML=z.map(x=>"<div style='padding:10px;border-bottom:1px solid #243a54'><b>"+esc(x.formula_name||"Training")+"</b> — "+esc(x.author_name||"Agent")+" ["+esc(x.status||"pending")+"]</div>").join("")||"No submissions."}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}$("out").onclick=()=>sb.auth.signOut().then(()=>location.reload());
</script></body></html>
