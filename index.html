','Basic','Intermediate','Advanced'].forEach(x=>{let b=document.createElement('button');b.className='chip'+(x==='All'?' active':'');b.textContent=x;b.onclick=()=>{L=x;document.querySelectorAll('.chip').forEach(z=>z.classList.remove('active'));b.classList.add('active');render()};chips.appendChild(b)});function render(){let q=document.getElementById('q').value.toLowerCase();let a=F.filter(f=>(L==='All'||level(f)===L)&&(f.name+' '+f.cat+' '+f.formula+' '+f.sample+' '+f.explanation).toLowerCase().includes(q));count.textContent=F.length+' formulas • '+a.length+' shown • click any formula for full example';grid.innerHTML=a.map(f=>`<div class="card" onclick="openM(${F.indexOf(f)})"><span class="badge">${level(f)} • ${f.cat}</span><div class="name">${f.name}</div><div class="cat">Click for sample data + explanation</div><div class="code">${esc(f.formula)}</div></div>`).join('')}function openM(i){let f=F[i];detail.innerHTML=`<span class="badge">${level(f)} • ${f.cat}</span><h2 style="color:#1765ad;font-size:30px">${f.name}</h2><h3>🧮 Formula</h3><div class="code">${esc(f.formula)}</div><div class="info"><b>📊 Sample Data</b><br><br>${esc(f.sample)}</div><div class="info"><b>🧾 Formula Used with Data</b><br><br><div class="code">${esc(f.formula)}</div><br><small>Replace the cell references with the sample values shown above to reproduce the result.</small></div><div class="result">✅ Expected Result: ${esc(f.result)}</div><div class="info"><b>💡 Explanation</b><br><br>${esc(f.explanation)}</div>`;modal.style.display='flex'}function closeM(){modal.style.display='none'}q.oninput=render;lang.onchange=e=>{lang=e.target.value;install.textContent=T[lang].install};install.textContent=T.English.install;render();let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;install.style.display='block'});install.onclick=()=>dp?dp.prompt():alert('Chrome ⋮ → Add to Home screen / Install app');if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</
