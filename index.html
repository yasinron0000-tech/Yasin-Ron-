header{width:100%;max-width:100%;background:#0d47a1;color:white;padding:28px 20px 22px;border-radius:0 0 24px 24px;overflow:hidden}
.brand{font-size:30px;font-weight:800}.tag{opacity:.9;margin-top:5px}
main{width:100%;max-width:820px;padding:16px;margin:0 auto;overflow:hidden}.search{display:block;width:100%;max-width:100%;padding:15px;border:1px solid #d7dce5;border-radius:14px;font-size:16px}

.example{margin-top:14px;border-top:1px solid #e7eaf0;padding-top:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%;max-width:100%}.box{min-width:0;max-width:100%;background:#f8f9fc;padding:11px;border-radius:10px}
.box b{display:block;margin-bottom:5px;font-size:12px;color:#667085}.box code{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-family:monospace}
.result{margin-top:10px;padding:11px;border-radius:10px;background:#eef6ff}
.tip{margin-top:10px;color:#4b5565;font-size:14px;line-height:1.45}
button.install{display:block;max-width:100%;width:100%;padding:14px;border:0;border-radius:13px;background:#1565c0;color:white;font-size:16px;font-weight:700;margin:8px 0}
.toolbar{display:flex;gap:8px;align-items:center;width:100%;margin-bottom:8px}
.lang{flex:0 0 auto;padding:12px 10px;border:1px solid #d7dce5;border-radius:12px;background:white;font-size:14px}
.card{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}.card:active{transform:scale(.995)}
.hint{font-size:12px;color:#667085;margin:0 2px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:0;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
.close{float:right;border:0;background:#eef2f7;border-radius:50%;width:38px;height:38px;font-size:22px}
.modal-title{font-size:26px;font-weight:800;color:#1565c0;margin:4px 48px 4px 0}
.modal-cat{font-size:13px;color:#77808f;margin-bottom:12px}
.detail-box{background:#f8f9fc;padding:12px;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}
.detail-box code{white-space:pre-wrap;word-break:break-word;font-family:monospace}
.detail-result{background:#eef6ff;padding:12px;border-radius:12px;margin:10px 0}
.detail-explain{line-height:1.55;color:#374151;margin-top:12px}
@media(max-width:480px){
  main{padding:14px}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}

.brand{position:relative;display:inline-block;animation:brandFloat 2.8s ease-in-out infinite,brandGlow 2.2s ease-in-out infinite}

@keyframes brandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.card.opening{animation:cardPop .45s cubic-bezier(.2,.8,.2,1)}

@keyframes cardPop{0%{opacity:.2;transform:scale(.96) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sheetIn{0%{opacity:0;transform:translateY(35px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}

", "=VALUE(\"1250\")", "1250", "Useful before calculations when imported data is stored as text."], ["NUMBERVALUE", "Text", "=NUMBERVALUE(A2,\".\",\",\")", "Converts text to number while specifying decimal and thousands separators.", "A2 = 1.234,56", "=NUMBERVALUE(\"1.234,56\",\",\",\".\")", "1234.56", "Useful for international number formats."], ["EOMONTH", "Date & Time", "=EOMONTH(A2,0)", "Returns the last day of a month.", "Date A2 = 15-Aug-2026", "=EOMONTH(DATE(2026,8,15),0)", "31-Aug-2026", "Useful for month-end reporting and payroll periods."], ["EDATE", "Date & Time", "=EDATE(A2,3)", "Moves a date by a number of months.", "Start date = 15-Aug-2026", "=EDATE(DATE(2026,8,15),3)", "15-Nov-2026", "Useful for due dates, review dates and monthly cycles."], ["WORKDAY", "Date & Time", "=WORKDAY(A2,10)", "Returns a date after a specified number of working days.", "Start = 03-Aug-2026\nWorking days = 10", "=WORKDAY(DATE(2026,8,3),10)", "17-Aug-2026", "Useful for SLA due dates and business-day deadlines."], ["WEEKNUM", "Date & Time", "=WEEKNUM(A2,2)", "Returns the week number for a date.", "Date = 13-Aug-2026", "=WEEKNUM(DATE(2026,8,13),2)", "33", "Useful for weekly performance reports."], ["YEARFRAC", "Date & Time", "=YEARFRAC(A2,B2)", "Returns the fraction of a year between two dates.", "Start = 01-Jan-2026\nEnd = 01-Jul-2026", "=YEARFRAC(DATE(2026,1,1),DATE(2026,7,1))", "0.5", "Useful for tenure, prorated calculations and financial analysis."], ["RANK.EQ", "Statistical", "=RANK.EQ(B2,$B$2:$B$10,0)", "Ranks a number within a list.", "Scores: 95,90,88,80\nYasin score = 90", "=RANK.EQ(90,{95,90,88,80},0)", "2", "Useful for agent rankings, sales rankings and leaderboards."], ["PERCENTILE.INC", "Statistical", "=PERCENTILE.INC(B2:B100,0.9)", "Returns the value at a chosen percentile.", "Scores: 60,70,80,90,100", "=PERCENTILE.INC(B2:B6,0.9)", "96", "Useful for SLA thresholds, performance bands and outlier analysis."], ["QUARTILE.INC", "Statistical", "=QUARTILE.INC(B2:B100,3)", "Returns a quartile value.", "Scores: 50,60,70,80,90,100", "=QUARTILE.INC(B2:B7,3)", "87.5", "Useful for segmenting performance into four bands."], ["STDEV.S", "Statistical", "=STDEV.S(B2:B100)", "Calculates sample standard deviation.", "Scores: 80,85,90,95,100", "=STDEV.S(B2:B6)", "7.91", "Measures how spread out sample performance values are."], ["CORREL", "Statistical", "=CORREL(B2:B100,C2:C100)", "Measures correlation between two datasets.", "Login hours: 7,8,9,10\nProductivity: 70,80,88,92", "=CORREL(B2:B5,C2:C5)", "High positive correlation", "Useful for analyzing relationships between operational metrics."], ["FORECAST.LINEAR", "Statistical", "=FORECAST.LINEAR(E2,B2:B10,A2:A10)", "Predicts a future value using linear regression.", "Month: 1,2,3,4\nSales: 100,120,140,160\nForecast month: 5", "=FORECAST.LINEAR(5,B2:B5,A2:A5)", "180", "Useful for simple trend-based forecasting."], ["RAND", "Advanced", "=RAND()", "Generates a random decimal between 0 and 1.", "Recalculation changes the value", "=RAND()", "0 to <1", "Useful for simulations and randomized test data."], ["RANDBETWEEN", "Advanced", "=RANDBETWEEN(1000,9999)", "Generates a random whole number in a range.", "Minimum = 1000\nMaximum = 9999", "=RANDBETWEEN(1000,9999)", "Example: 4821", "Useful for creating test IDs and sample datasets."], ["ISBLANK", "Logical", "=ISBLANK(A2)", "Checks whether a cell is empty.", "A2 is blank", "=ISBLANK(A2)", "TRUE", "Useful for data-quality checks and conditional formulas."], ["ISNUMBER", "Logical", "=ISNUMBER(A2)", "Checks whether a value is a number.", "A2 = 1250", "=ISNUMBER(1250)", "TRUE", "Useful for validating imported data."], ["ISTEXT", "Logical", "=ISTEXT(A2)", "Checks whether a value is text.", "A2 = Yasin", "=ISTEXT(\"Yasin\")", "TRUE", "Useful for data validation."], ["CELL", "Information", "=CELL(\"address\",A2)", "Returns information about a referenced cell.", "Reference = A2", "=CELL(\"address\",A2)", "$A$2", "Useful for dynamic audit and reporting formulas."], ["ROW", "Lookup & Reference", "=ROW(A2)", "Returns the row number of a reference.", "Reference = A2", "=ROW(A2)", "2", "Useful for generating sequence numbers and dynamic references."], ["COLUMN", "Lookup & Reference", "=COLUMN(C2)", "Returns the column number of a reference.", "Reference = C2", "=COLUMN(C2)", "3", "Useful for dynamic formulas and column-aware logic."], ["OFFSET", "Advanced", "=SUM(OFFSET(B2,0,0,5,1))", "Returns a range offset from a starting cell.", "Values B2:B6 = 10,20,30,40,50", "=SUM(OFFSET(B2,0,0,5,1))", "150", "Useful for dynamic ranges, though INDEX is often preferred for performance."], ["INDIRECT", "Advanced", "=SUM(INDIRECT(\"B2:B6\"))", "Converts text into a cell/range reference.", "Text reference = B2:B6\nValues = 10,20,30,40,50", "=SUM(INDIRECT(\"B2:B6\"))", "150", "Useful for dynamic references, but volatile formulas can affect workbook performance."], ["ADDRESS", "Lookup & Reference", "=ADDRESS(5,3)", "Creates a cell address from row and column numbers.", "Row = 5\nColumn = 3", "=ADDRESS(5,3)", "$C$5", "Useful when building dynamic references."], ["FORMULATEXT", "Information", "=FORMULATEXT(B2)", "Returns the formula stored in a cell as text.", "B2 contains =SUM(C2:C6)", "=FORMULATEXT(B2)", "=SUM(C2:C6)", "Useful for auditing and documenting formula-driven workbooks."]];
const chips=["All","A–Z","Lookup","Logical","Text","Date","Math","Statistics","Dynamic","Pro","Advanced"];
let active="All";
function matches(f){
 const cat=active==="All"||active==="A–Z"||
 (active==="Lookup"&&f[1].includes("Lookup"))||
 (active==="Date"&&f[1].includes("Date"))||
 (active==="Math"&&f[1].includes("Math"))||
 (active==="Statistics"&&f[1].includes("Statistical"))||
 f[1].startsWith(active);
 const q=document.getElementById("search").value.toLowerCase();
 return cat && f.join(" ").toLowerCase().includes(q);
}
function textFor(f){
  return (lang==="en" ? f[3] : (desc[lang][f[0]] || f[3]));
}
function render(){
 const a=formulas.filter(matches).sort((x,y)=>x[0].localeCompare(y[0]));
 const t=ui[lang];
 document.getElementById("count").textContent=a.length+" "+t.count;
 document.getElementById("hint").textContent=t.hint;
 document.getElementById("search").placeholder=t.search;
 document.querySelector(".tag").textContent=t.tag;
 document.getElementById("list").innerHTML=a.map((f,i)=>`
 <article class="card" onclick="openModal(${formulas.indexOf(f)})">
  <div class="name">${f[0]}</div><div class="cat">${catNames[lang][f[1]]||f[1]}</div>
  <div class="formula">${f[2]}</div>
  <div class="example">
   <div class="grid">
    <div class="box"><b>${t.sample}</b><code>${f[4]}</code></div>
    <div class="box"><b>${t.used}</b><code>${f[5]}</code></div>
   </div>
   <div class="result"><b>${t.result}</b><br><code>${f[6]}</code></div>
   <div class="tip"><b>${t.explain}</b> ${textFor(f)} ${f[7]}</div>
  </div>
 </article>`).join("");
}
function openModal(i){
 const f=formulas[i], t=ui[lang];
 document.querySelectorAll(".card").forEach(c=>c.classList.remove("opening"));
 const cards=[...document.querySelectorAll(".card")];
 if(cards.length) cards[formulas.slice().filter(matches).sort((x,y)=>x[0].localeCompare(y[0])).indexOf(f)]?.classList.add("opening");
 document.getElementById("modalTitle").textContent=f[0];
 document.getElementById("modalCat").textContent=catNames[lang][f[1]]||f[1];
 document.getElementById("modalFormula").textContent=f[2];
 document.getElementById("modalSample").textContent=f[4];
 document.getElementById("modalUsed").textContent=f[5];
 document.getElementById("modalResult").textContent=f[6];
 document.getElementById("modalExplain").textContent=" "+textFor(f)+" "+f[7];
 document.getElementById("sampleLabel").textContent=t.sample;
 document.getElementById("usedLabel").textContent=t.used;
 document.getElementById("resultLabel").textContent=t.result;
 document.getElementById("explainLabel").textContent=t.explain;
 document.getElementById("modal").classList.add("show");
 document.body.style.overflow="hidden";
}
function closeModal(){document.getElementById("modal").classList.remove("show");document.body.style.overflow="";}

const chipLabels={
en:{All:"All","A–Z":"A–Z",Lookup:"Lookup",Logical:"Logical",Text:"Text",Date:"Date",Math:"Math",Statistics:"Statistics",Dynamic:"Dynamic",Pro:"Pro",Advanced:"Advanced"},
hi:{All:"सभी","A–Z":"A–Z",Lookup:"लुकअप",Logical:"लॉजिकल",Text:"टेक्स्ट",Date:"दिनांक",Math:"गणित",Statistics:"सांख्यिकी",Dynamic:"डायनेमिक",Pro:"प्रो",Advanced:"एडवांस्ड"},
mr:{All:"सर्व","A–Z":"A–Z",Lookup:"लुकअप",Logical:"लॉजिकल",Text:"टेक्स्ट",Date:"दिनांक",Math:"गणित",Statistics:"सांख्यिकी",Dynamic:"डायनॅमिक",Pro:"प्रो",Advanced:"अॅडव्हान्स्ड"}
};
function renderChips(){
 document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip ${c==="All"?"active":""}" onclick="active='${c}';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');render()">${chipLabels[lang][c]}</button>`).join("");
}
document.getElementById("lang").value=lang;
document.getElementById("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("yr_lang",lang);active="All";renderChips();render();};
document.getElementById("search").oninput=render;
renderChips();
render();

let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("installBtn").hidden=false});
document.getElementById("installBtn").onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById("installBtn").hidden=true}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
