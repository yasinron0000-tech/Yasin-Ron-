function buildChips(){els.chips.innerHTML='';const t=text();[['All',t.all],['Basic',t.basic],['Intermediate',t.intermediate],['Advanced',t.advanced]].forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.className='chip'+(selected===key?' active':'');b.textContent=label;b.addEventListener('click',()=>{selected=key;buildChips();render()});els.chips.appendChild(b)})}
function render(){const q=els.q.value.trim().toLowerCase();const arr=F.filter(f=>(selected==='All'||level(f)===selected)&&(`${f.name} ${f.cat} ${f.formula} ${f.sample} ${f.explanation}`.toLowerCase().includes(q)));const t=text();els.count.textContent=`${F.length} formulas • ${arr.length} shown • ${t.click}`;if(!arr.length){els.grid.innerHTML='<div class="empty">No formulas found.<br>Try SUM, IF, XLOOKUP or FILTER.</div>';return}els.grid.innerHTML=arr.map(f=>`<article class="card" data-index="${F.indexOf(f)}"><span class="badge">${level(f)} • ${esc(f.cat)}</span><div class="name">${esc(f.name)}</div><div class="cat">${esc(t.click)}</div><div class="code">${esc(f.formula)}</div></article>`).join('');els.grid.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openModal(Number(c.dataset.index))))}
function openModal(i){const f=F[i],t=text();els.detail.innerHTML=`<span class="badge">${level(f)} • ${esc(f.cat)}</span><h2 class="detail-title">${esc(f.name)}</h2><h3>🧮 Formula</h3><div class="code">${esc(f.formula)}</div><div class="info"><b>${t.sample}</b><br><br>${esc(f.sample)}</div><div class="info"><b>${t.used}</b><br><br><div class="code">${esc(f.formula)}</div><br><small>Use the sample values above in the referenced cells to reproduce the result.</small></div><div class="result">${t.result}: ${esc(f.result)}</div><div class="info"><b>${t.explain}</b><br><br>${esc(f.explanation)}</div>`;els.modal.classList.add('show');els.modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeModal(){els.modal.classList.remove('show');els.modal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
els.q.addEventListener('input',render);els.lang.addEventListener('change',e=>{currentLang=e.target.value;setLanguage()});els.close.addEventListener('click',closeModal);els.modal.addEventListener('click',e=>{if(e.target===els.modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;els.install.style.display='block'});els.install.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else alert('Chrome ⋮ → Add to Home screen / Install app')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
setLanguage();
</script></body></html>
